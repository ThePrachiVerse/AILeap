<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="login">
      <div class="rule" aria-hidden="true"></div>
      <h1>User Login</h1>
      <form id="login-form" novalidate>
        <label class="field">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="6" width="18" height="12" rx="1.2" stroke="currentColor" stroke-width="1.8" />
              <path d="M4 7.2 12 13l8-5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <input type="email" name="email" placeholder="Email ID" autocomplete="username" required />
        </label>
        <label class="field">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M17 9V8a5 5 0 0 0-10 0v1H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1h-1Zm-8-1a3 3 0 0 1 6 0v1H9V8Zm4.2 8.2v1.3a1.2 1.2 0 0 1-2.4 0v-1.3a2 2 0 1 1 2.4 0Z"
              />
            </svg>
          </span>
          <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
        </label>
        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember" checked />
            <span class="box" aria-hidden="true"></span>
            Remember me
          </label>
          <a class="forgot" href="#forgot">Forgot Password?</a>
        </div>
        <button type="submit">LOGIN</button>
        <p id="login-status" class="status" hidden></p>
      </form>
      <div class="rule" aria-hidden="true"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
